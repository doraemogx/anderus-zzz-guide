name: Motores-W — dados factuais e nomes PT-BR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_gear.py'
      - '.github/workflows/gear.yml'
permissions:
  contents: write
jobs:
  gear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.2
      - run: python scripts/generate_gear.py
      - name: Salva dados verificados sem alterar o inventário do usuário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gear-ptbr.json data/gear-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Motores-W: nomes e numeros PT-BR extraidos"
            git pull --rebase
            git push
          fi
