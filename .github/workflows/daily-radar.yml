name: Radar ZZZ - varredura a cada 3 horas
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: radar-zzz-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_radar.py
      - name: Publica feed revisado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/updates.json
          if ! git diff --cached --quiet; then
            git commit -m "Radar: atualiza noticias oficiais e revisoes beta"
            git push
