name: Verifica e salva imagens do guia ZZZ
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/media-sources.json'
      - 'scripts/mirror_images.py'
      - '.github/workflows/media-assets.yml'
  schedule:
    - cron: '20 12 * * 1'
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Tenta fontes identificadas e valida arquivos reais
        run: python scripts/mirror_images.py
      - name: Salva apenas imagens verificadas e relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/agents assets/engines assets/discs data/media-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Media: imagens verificadas e espelhadas no site"
            git push
          fi
