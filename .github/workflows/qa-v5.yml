name: QA V5 — híbrida e dados da Conta do Anderus
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/anderus-v5.js'
      - 'assets/anderus-v5.css'
      - 'scripts/smoke_v5.mjs'
      - '.github/workflows/qa-v5.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/anderus-v5.js
      - run: python -c "import json; d=json.load(open('data/encyclopedia.json')); assert len(d['agents'])>=60; assert all(len(x.get('mindscapes',[]))==6 for x in d['agents'].values()); print('Mindscapes:',len(d['agents']))"
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Teste mobile com catálogo, Mindscapes, conta e radar
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/and-v5-server.log 2>&1 &
          sleep 2
          node scripts/smoke_v5.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-anderus-v5-hibrida
          path: v5-hibrida-s25-edge.png
