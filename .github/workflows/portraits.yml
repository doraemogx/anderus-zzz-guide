name: Retratos quadrados dos 65 agentes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_portraits.py'
      - '.github/workflows/portraits.yml'
permissions:
  contents: write
jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 beautifulsoup4==4.14.2
      - run: python scripts/build_portraits.py
      - name: Commit retratos reais e auditados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portraits data/portrait-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Retratos: padroniza 65 agentes para interface mobile"
            git pull --rebase
            git push
          fi
