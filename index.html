cial e recomece a rotação."],"breaks":[{"label":"Maestria de Anomalia inicial","key":"mastery","target":255,"rule":"A meta de 255 considera Maestria inicial, não buffs temporários de combate. Com Core F, motor S de Maestria, Disco 6 de Maestria e 2p Phaethon's Melody, é possível alcançar o teto."},{"label":"Proficiência de Anomalia (referência de build)","key":"proficiency","target":330,"rule":"Meta indicativa para dano; depende do motor e buffs. O valor de Maestria é a condição de maior importância da passiva."}],"mains":["4 · Proficiência de Anomalia","5 · Bônus de Dano de Fogo / PEN","6 · Maestria de Anomalia"],"sub":"Proficiência > ATQ% > PEN > ATQ plano. CRIT tradicional NÃO aumenta os críticos especiais de anomalia como se fosse uma build de Atacante.","ideal4":"Freedom Blues","ideal2":"Phaethon's Melody","support":"Em equipes com Velina, a rotação com aplicações de Vento e Disfunção é relevante. Com Remielle a frequência de Queimadura tem valor adicional.","source":"https://www.icy-veins.com/zenless-zone-zero/phoenix-guide-best-builds"},"Velina Airgid":{"tag":"Anomalia de Vento / aplicação fora de campo","overview":"Velina aplica estados de Vento e cria gatilhos de Windswept/Vortex. Pode preparar a luta antes de outra Anomalia entrar em campo. Sua passiva central também converte Regeneração de Energia inicial acima de um patamar em dano e Maestria.","rotation":["Entre para aplicar o efeito de Vento e preparar o campo.","Ative a habilidade necessária para manter Windswept/Vortex.","Troque para Phoenix ou outra Anomalia principal e dispare as reações.","Renove os efeitos de Velina de acordo com o tempo de duração, sem tomar todo o tempo de campo."],"breaks":[{"label":"Regeneração de Energia inicial","key":"energy","target":1.2,"rule":"Acima de 1,2, cada 0,01 adicional aumenta os bônus da passiva, até o limite descrito no kit. Atingir 1,2 é o ponto de início, NÃO o máximo."}],"mains":["4 · Proficiência de Anomalia","5 · Dano de Vento / ATQ% / PEN","6 · Regeneração de Energia"],"sub":"Proficiência, ATQ% e Regeneração/atributos que favorecem a rotação. Não use alvo de crítico de DPS convencional.","ideal4":"Wuthering Salon","ideal2":"Moonlight Lullaby","support":"Joyau Dore traz Regeneração de Energia e apoio de equipe. A sinergia com Phoenix não exige que Velina passe o combate todo em campo.","source":"https://www.icy-veins.com/zenless-zone-zero/velina-guide-best-builds"},"Jane Doe":{"tag":"Carry de Anomalia / Assalto físico","overview":"Jane aplica Assalto com grande frequência, usa esquivas e assistências para acumular Passion Stream e entra no estado Passion. Seu dano de Anomalia Física pode critar com uma taxa especial definida pelo kit e pela Proficiência de Anomalia, não pelo CRIT convencional do equipamento.","rotation":["Aplique buffs de Seth, Rina ou suporte apropriado.","Use esquivas e contra-ataques para carregar Passion.","Permaneça em campo aplicando Anomalia Física e provocando Assaltos.","Renove os buffs e aproveite os inimigos já afetados por outra Anomalia para Disfunção."],"breaks":[{"label":"Proficiência em combate para o limite de ATQ da Paixão","key":"proficiency","target":420,"rule":"420 de Proficiência DURANTE O COMBATE maximiza o bônus de ATQ da Paixão. 375 também é um marco relevante para o crítico especial de Assalto; não confunda os dois."}],"mains":["4 · Proficiência de Anomalia","5 · Dano Físico / PEN / ATQ%","6 · Maestria de Anomalia"],"sub":"Proficiência > ATQ% > PEN > ATQ. Taxa CRIT e Dano CRIT comuns são prioridade baixa.","ideal4":"Fanged Metal","ideal2":"Freedom Blues","support":"Assalto aplica o bônus do conjunto Fanged Metal. Procure manter Paixão ativa, em vez de montar uma build CRIT como se Jane fosse Atacante.","source":"https://www.icy-veins.com/zenless-zone-zero/jane-doe-guide-best-builds"},"Rina":{"tag":"Suporte / perfuração e utilidade elétrica","overview":"Rina (Alexandrina Sebastiane) fornece PEN Ratio aos aliados enquanto Drusilla e Anastella permanecem em campo. Com seus efeitos potencializados, a saída dos bonecos pode ser prolongada pelo estado Impecável. Priorize o teto de PEN Ratio e a janela ativa do suporte, não dano pessoal.","rotation":["Entre com Rina e invoque os bonecos por Básico, Especial ou assistência.","Troque rápido para seu DPS enquanto os bonecos permanecem no campo.","Reaplique o bônus quando os bonecos retornarem.","Nas equipes elétricas, use a sinergia com Choque para aproveitar seu efeito adicional."],"breaks":[{"label":"PEN Ratio para teto do bônus de equipe (referência)","key":"pen","target":72,"rule":"Com o Core e desbloqueios apropriados, ~72% de PEN Ratio permite chegar ao máximo do buff em versões recentes do kit. O valor mostrado deve considerar o estado relevante da personagem."}],"mains":["4 · ATQ% / Proficiência (situacional)","5 · PEN Ratio","6 · Regeneração de Energia"],"sub":"PEN Ratio para buff; Regeneração de Energia e atributos de utilidade. Não invista em crítico só para aumentar o buff de PEN.","ideal4":"Moonlight Lullaby","ideal2":"Puffer Electro","support":"A passiva adicional de Rina ativa com outro agente Elétrico ou da facção Victoria Housekeeping. O buff de PEN normal dela não depende obrigatoriamente desse gatilho adicional.","source":"https://www.prydwen.gg/zenless/characters/rina"},"Sunbringer":{"tag":"BETA 3.4 / Armeiro, Fogo Gênese","overview":"No beta, Sunbringer usa DEF e dano Sharp de Fogo Gênese. A mecânica de Gash/Maim aparece nas habilidades atuais, com golpes que consomem marcas para dano adicional. Os multiplicadores, as condições e a classificação final podem mudar entre revisões.","rotation":["Prepare bônus de proteção e a janela do atordoador.","Acumule as marcas e os recursos próprios indicados na versão atual do beta.","Execute o quarto ataque e consuma Gash para disparar Maim.","Reavalie a sequência após cada patch: não há rotação final confirmada."],"breaks":[],"mains":["4 · CRIT / DEF (provisório)","5 · Dano Fogo / DEF (provisório)","6 · DEF% (provisório)"],"sub":"DEF const MAIN_NAV=['home','learn','agents','engines','account','updates'];
const lessons=[
{id:'intro',name:'O que é ZZZ?',sub:'Papel do Proxy e estrutura do jogo',body:`<p>Zenless Zone Zero é um RPG de ação em tempo real, com <b>equipes de três agentes</b> e, normalmente, um Bangboo de apoio. Em vez de clicar em habilidades por turnos, você controla diretamente um agente, desvia, bloqueia ou troca de personagem e explora janelas de dano.</p><p>O Proxy é quem organiza a exploração das Cavidades. Sua progressão envolve história, comissões, níveis de personagem, armas (W-Engines), discos, talentos e recursos para o endgame. Os primeiros capítulos são a hora de conhecer o combate; não é preciso maximizar seis equipes de imediato.</p><div class="note">Seu objetivo inicial: escolher um time funcional, elevar níveis e habilidades centrais, entender <b>Esquiva → Assistência → Atordoamento → Janela de dano</b> e só depois otimizar discos.</div>`},
{id:'combat',name:'Combate em 60 segundos',sub:'Ataque, esquiva, EX e suprema',body:`<p>O <b>Ataque Básico</b> produz golpes e frequentemente recursos de kit. A <b>Esquiva</b> evita o golpe; a Esquiva Perfeita geralmente habilita um contra-ataque. O <b>Ataque Especial EX</b> consome energia e pode gerar efeitos potentes, enquanto a <b>Suprema</b> gasta decibéis.</p><p>As <b>Assistências</b> permitem entrar com outro agente em segurança e, em muitos times, acelerar a rotação. O combate avançado alterna momentos de preparação com uma janela curta de dano máximo. O time não precisa dividir igualmente o tempo em campo.</p><h4>Mini-rotação</h4><div class="step"><b>1</b><div>Ative o efeito persistente do suporte ou da Anomalia secundária.</div></div><div class="step"><b>2</b><div>Use atordoador para aumentar Daze, se houver um no time.</div></div><div class="step"><b>3</b><div>Com os bônus ativos, entregue o tempo de campo ao causador principal de dano.</div></div><div class="step"><b>4</b><div>Renove os efeitos e recomece.</div></div>`},
{id:'daze',name:'Daze e Atordoamento',sub:'Por que um atordoador ajuda tanto',body:`<p>Ao atingir um inimigo, algumas ações acumulam <b>Daze</b> (o medidor de atordoamento). Quando ele enche, o alvo fica atordoado: recebe uma janela vulnerável e frequentemente permite <b>Ataques em Cadeia</b>. A especialidade <b>Atordoador</b> é construída para encher essa barra mais rápido, geralmente com Impacto e habilidades que multiplicam Daze.</p><p>Um bom atordoador não precisa causar o maior dano direto. Sua missão é <b>entregar a janela</b> ao personagem certo. Não confunda Impacto (ajuda no Daze) com ATQ ou Maestria de Anomalia (aplicação de efeitos elementais).</p>`},
{id:'anomaly',name:'Anomalias elementais',sub:'Medidor, efeitos e proc',body:`<p>Personagens de Anomalia acumulam um <b>medidor de Atributo</b> ao atacar. Ao completar esse medidor, a Anomalia correspondente é aplicada. Exemplo: Físico costuma gerar <b>Assalto</b>; Elétrico gera <b>Choque</b>; Fogo gera <b>Queimadura</b>; Gelo pode gerar <b>Congelamento/Estilhaçamento</b>; Éter gera <b>Corrupção</b>. A versão atual também inclui atributos especiais com regras próprias.</p><p><b>Maestria de Anomalia</b> tende a afetar a velocidade de aplicação; <b>Proficiência de Anomalia</b> afeta o dano causado pela Anomalia. É por isso que a Jane não é construída como um DPS tradicional de CRIT: o Assalto tem suas próprias regras.</p><div class="note">Anomalia ≠ dano crítico comum. A Phoenix e a Jane têm formas específicas de produzir críticos em dano anômalo, mas isso não significa equipar CRIT Rate comum indiscriminadamente.</div>`},
{id:'disorder',name:'Disfunção e reações',sub:'Misturar atributos do jeito certo',body:`<p><b>Disfunção (Disorder)</b> ocorre quando você aplica outra Anomalia sobre um inimigo que já sofre uma Anomalia compatível. Isso produz dano e acelera a utilização do efeito anterior. Em equipes com duas Anomalias, alternar a aplicação dos atributos não é apenas cosmético: é o centro da rotação.</p><p><b>Vortex e Windswept</b> são interações especiais do Vento presentes nos kits recentes. <b>Abloom</b> aparece em personagens específicos como Phoenix. Esses nomes não são sinônimos universais de Disfunção; seus multiplicadores e gatilhos são descritos nas habilidades dos agentes.</p><h4>Exemplo da sua conta</h4><p>Velina prepara Vento e Phoenix aplica Fogo. Essa interação pode produzir efeitos especiais ligados aos kits e à Anomalia, mas o resultado depende da condição de cada habilidade e de quem provocou o efeito.</p>`},
{id:'roles',name:'As especialidades',sub:'Sete estilos de personagem',body:`<div class="grid two"><div class="entry"><h4>Atacante</h4><p>Dano direto com CRIT, ATQ e janelas de explosão.</p></div><div class="entry"><h4>Anomalia</h4><p>Acúmulo de atributo e dano de efeitos elementais.</p></div><div class="entry"><h4>Atordoador</h4><p>Produz Daze e abre a janela.</p></div><div class="entry"><h4>Suporte</h4><p>Ativa buffs, energia e utilidade.</p></div><div class="entry"><h4>Defesa</h4><p>Escudos, proteção e assistência.</p></div><div class="entry"><h4>Destruidor</h4><p>Especialidade de dano Sheer/Rupture com escala própria.</p></div><div class="entry"><h4>Armeiro</h4><p>Sharp e mecânicas especializadas da versão 3.x.</p></div></div><p>A <b>especialidade</b> também determina quais passivas de motor podem funcionar. Um motor de Anomalia equipado num Atacante pode perder sua passiva por não corresponder à especialidade.</p>`},
{id:'engines',name:'O que é W-Engine?',sub:'Motor, ranque e efeito passivo',body:`<p>W-Engine é a arma de ZZZ. Ele aumenta atributos básicos e possui <b>atributo avançado</b> e uma <b>passiva</b>. A passiva normalmente só ativa para a especialidade adequada; equipar um motor S em qualquer personagem não garante a compatibilidade. Ao subir de nível, você melhora atributos; ao combinar cópias, melhora o refinamento da passiva.</p><p><b>Assinatura</b> significa motor desenhado para uma personagem específica, não uma obrigação absoluta. Muitos motores de rank A oferecem bom valor. Avalie três coisas: compatibilidade de especialidade, estatística secundária e facilidade de manter a passiva ativa durante a rotação.</p>`},
{id:'discs',name:'Discos de unidade',sub:'6 peças, principais e subatributos',body:`<p>Um agente equipa até <b>seis discos</b>. Os conjuntos costumam dar efeitos ao equipar 2 ou 4 peças. Portanto, <b>4+2</b> é uma configuração comum; <b>2+2+2</b> também pode funcionar conforme a build.</p><p>As posições 1, 2 e 3 têm atributos principais fixos; as posições 4, 5 e 6 são as grandes escolhas de build. Exemplos: Disco 4 para Proficiência/CRIT; Disco 5 para Dano Elemental/PEN/ATQ%; Disco 6 para Maestria, Impacto ou Regeneração de Energia conforme a especialidade.</p><p>Para o começo do jogo, não desperdice recursos tentando buscar discos perfeitos. Primeiro combine <b>set correto + atributo principal correto</b>. Depois refine subatributos.</p>`},
{id:'stats',name:'Atributos explicados',sub:'ATQ, CRIT, PEN, Impacto e mais',body:`<div class="grid two"><div class="entry"><h4>ATQ / ATQ%</h4><p>Contribui para ataques com escalonamento de ataque. Nem todo personagem escala com ATQ.</p></div><div class="entry"><h4>Taxa CRIT / Dano CRIT</h4><p>Afeta o dano crítico comum; não copie esses alvos para Anomalia sem verificar o kit.</p></div><div class="entry"><h4>PEN Ratio</h4><p>Ignora parte da defesa do inimigo; na Rina é a base de um buff importante.</p></div><div class="entry"><h4>Impacto</h4><p>Acelera a geração de Daze por habilidades de atordoamento.</p></div><div class="entry"><h4>Proficiência de Anomalia</h4><p>Aumenta o dano de Anomalias aplicadas.</p></div><div class="entry"><h4>Maestria de Anomalia</h4><p>Ajuda a acumular anomalia mais rápido; também pode ativar metas de certas passivas.</p></div><div class="entry"><h4>Regeneração de Energia</h4><p>Permite mais EX; também alimenta passivas de agentes como Velina.</p></div><div class="entry"><h4>DEF / PV</h4><p>Defesa e vida; alguns agentes recentes convertem esses valores em dano.</p></div></div>`},
{id:'passives',name:'Passivas e formação',sub:'Habilidade central x adicional',body:`<p>A <b>Passiva Central</b> geralmente funciona por existir no kit e por usar suas condições de combate. Já a <b>Habilidade Adicional</b> costuma depender de quem acompanha o agente no trio. Frequentemente a ativação exige alguém do mesmo atributo ou da mesma facção, mas há exceções de especialidade e regras próprias.</p><p>A Jane, por exemplo, ativa sua habilidade adicional com outra Anomalia <b>ou</b> alguém da mesma facção. A Velina tem uma condição específica envolvendo Anomalia/Vento. A Rina usa Elétrico/Victoria Housekeeping. Por isso a área Anderus marca regras verificadas e deixa as demais como <b>não verificadas</b>.</p><div class="note">A conta não lê automaticamente sua conta HoYoverse. É você quem cadastra o que realmente possui.</div>`},
{id:'teams',name:'Como montar três agentes',sub:'Carry, preparo e sustentação',body:`<p><b>Equipe tradicional:</b> DPS + Atordoador + Suporte. O atordoador abre janelas, o suporte amplifica o DPS e o atacante executa o burst.</p><p><b>Equipe de Anomalia:</b> Anomalia principal + segunda Anomalia + Suporte. O foco muda para aplicar atributos, provocar Disfunção e manter os efeitos ativos.</p><p><b>Equipe de Rupture/Sharp:</b> respeita as escalas específicas de DEF/PV e dos novos tipos de dano; não é seguro copiar a build de uma equipe antiga de ATQ.</p><p>O melhor trio também depende de <b>resistência do inimigo, modo endgame, tempo de campo e condição da passiva adicional</b>. Um personagem forte isolado pode ter menos valor se roubar tempo de campo do carry.</p>`},
{id:'endgame',name:'Como funciona o endgame?',sub:'Shiyu, Deadly Assault e investimento',body:`<p>No <b>Shiyu Defense</b>, a formação e o tempo de conclusão são fundamentais. Em andares com lados separados, você precisa de <b>duas equipes distintas</b>. O <b>Deadly Assault</b> costuma exigir três equipes para atender aos chefes/slots disponíveis, de forma que seis agentes fortes são o primeiro passo e nove agentes estruturados são uma meta de longo prazo.</p><p>Comece com o núcleo Phoenix + Velina. Para a segunda equipe, Jane já oferece outra forma de dano. Depois, escolha suportes e atordoadores para não disputar as mesmas unidades. É mais eficiente terminar três unidades com bons discos do que investir superficialmente em 15.</p>`},
{id:'farm',name:'Evolução e farm',sub:'O que melhorar primeiro',body:`<div class="step"><b>1</b><div>Suba o nível do DPS e do motor equipados até o máximo disponível para seu Inter-Knot.</div></div><div class="step"><b>2</b><div>Invista nas habilidades que realmente escalam o dano ou o buff; muitas vezes o Core vem primeiro.</div></div><div class="step"><b>3</b><div>Coloque 4+2 conjuntos funcionais e os principais dos discos 4, 5 e 6.</div></div><div class="step"><b>4</b><div>Monte os dois colegas de equipe e confirme que a habilidade adicional está ativa.</div></div><div class="step"><b>5</b><div>Só depois refine substats, discos perfeitos e upgrades marginais.</div></div><p>Guarde materiais raros para personagens com uso real no seu plano. Recursos de personagens em <b>beta</b> devem ser tratados como provisórios.</p>`},
{id:'gacha',name:'Banners e 50/50',sub:'Planejamento de recursos',body:`<p>Os banners de agente e de motor têm sistemas próprios de garantia e pity. Uma cópia extra de personagem libera <b>Mindscape</b>, enquanto cópias de motor aumentam o refinamento. Nem sempre M1 é superior a um novo suporte para a conta.</p><p>Se sua meta for a Sunbringer, o importante é separar os recursos da personagem e do motor e considerar a possibilidade de não obter o limitado na primeira chance. O valor exato de tiros depende do estado atual dos seus banners e das regras vigentes, não apenas do total de Polychromes.</p>`},
{id:'glossary',name:'Glossário de Nova Eridu',sub:'25 termos que você vai encontrar',body:`<div class="grid two">${[['Proxy','Seu papel na exploração e a conta que organiza a equipe.'],['Agente','Personagem controlável.'],['Bangboo','Companheiro de apoio do esquadrão.'],['Daze','Acúmulo que provoca Atordoamento.'],['Stun','Estado de inimigo atordoado.'],['Impacto','Atributo associado a gerar Daze.'],['EX','Especial aprimorada, consome energia.'],['Chain','Ataque em Cadeia na janela apropriada.'],['Ultimate','Suprema, consome Decibéis.'],['Assist','Troca com ação defensiva/ofensiva.'],['Anomalia','Efeito quando medidor elemental completa.'],['Assalto','Anomalia Física.'],['Choque','Anomalia Elétrica.'],['Queimadura','Anomalia de Fogo.'],['Corrupção','Anomalia de Éter.'],['Disorder','Disfunção entre anomalias.'],['Windswept','Efeito de Vento com regras próprias.'],['Vortex','Interação/efeito especial de Vento.'],['Abloom','Dano especial de certas habilidades de Anomalia.'],['W-Engine','Motor/arma de um agente.'],['Drive Disc','Disco de equipamento e conjunto.'],['Mindscape','Duplicatas e melhorias da personagem.'],['Core Skill','Passiva/Habilidade central e adicional.'],['PEN Ratio','Taxa de perfuração de defesa.'],['Sharp','Tipo de dano de kits recentes, com regras específicas.']].map(([x,y])=>`<div class="entry"><h4>${e(x)}</h4><p>${e(y)}</p></div>`).join('')}</div>`},
];

lessons.splice(5,0,{id:'elements',name:'Atlas de reações',sub:'Todos os efeitos elementais, comparados',body:`<p>Uma reação não é só uma cor na barra. Cada <b>Anomalia</b> tem um comportamento próprio. Ao misturar atributos, você pode provocar Disfunção; já certos personagens criam efeitos exclusivos por cima das regras gerais. Veja o atlas abaixo para não confundir o estado do inimigo com o nome de um golpe.</p><div class="grid two"><div class="entry"><h4>🔥 Fogo · Queimadura</h4><p>Provoca dano periódico durante sua duração. Seu valor aumenta em times que conseguem reaplicar Fogo ou converter essa Anomalia em uma nova reação. Phoenix cria efeitos de Abloom conforme seu kit, mas Abloom não é automaticamente igual à Queimadura.</p></div><div class="entry"><h4>⚡ Elétrico · Choque</h4><p>Em inimigos afetados, ataques podem disparar danos elétricos adicionais ao longo de um período. Equipes de Choque valorizam duração, frequência de acertos e certos bônus elétricos de suporte.</p></div><div class="entry"><h4>❄ Gelo · Congelamento/Estilhaçamento</h4><p>Congelamento impede ações temporariamente e o Estilhaçamento provoca uma instância de dano. O estado associado pode aumentar o dano crítico recebido. Geada, como a de Miyabi, possui regras específicas adicionais.</p></div><div class="entry"><h4>◉ Físico · Assalto/Flinch</h4><p>O Assalto causa um impacto de dano físico imediato; Flinch aumenta o Daze recebido por um período. Jane tem a particularidade de habilitar CRIT no Assalto por sua passiva especial.</p></div><div class="entry"><h4>✦ Éter · Corrupção</h4><p>Alvos corrompidos recebem dano adicional de Éter ao serem atingidos. É diferente de um golpe direto de Éter: a anomalia é um estado aplicado após preencher o medidor.</p></div><div class="entry"><h4>◈ Vento · Windswept/Vortex</h4><p>Vento aplica Windswept; outras aplicações podem interagir com esse estado gerando efeitos especiais, inclusive contaminação e Vortex segundo as habilidades. Velina é exemplo de unidade que altera como essa mecânica funciona.</p></div><div class="entry"><h4>✧ Lúmen / Lumiflux</h4><p>Há transformação de atributo em kits especiais. Lúmen não deve ser tratado como uma simples sexta cópia do medidor tradicional de Anomalia: sua aplicação pode depender das habilidades e da transformação.</p></div><div class="entry"><h4>🔥 Fogo Gênese / Sharp</h4><p>Na Sunbringer em beta, Genesis Flare, Gash e Sharp criam uma fórmula de dano própria, com DEF e regras especiais de Laceration. Não aplique automaticamente a regra de Queimadura a cada golpe Sharp.</p></div></div><h4>Disfunção: como saber se é o momento certo?</h4><p>Primeiro aplique um atributo no inimigo; depois aplique outro tipo enquanto o primeiro estado ainda está relevante. O dano resultante depende do atributo anterior, do tempo transcorrido e da contribuição dos agentes. Nas equipes tradicionais, isso incentiva alternar quem aplica Anomalia. Em times de Vento e Lúmen, os efeitos específicos do kit podem modificar a sequência.</p><div class="note"><b>Exemplo prático:</b> sua Velina pode preparar um estado de Vento e Phoenix entra para disparar a aplicação de Fogo. O resultado depende de Windswept/Vortex, da Anomalia aplicada e das condições efetivamente cumpridas — não basta apenas ter as duas no mesmo trio.</div><p>Referências: <a href="https://www.prydwen.gg/zenless/guides/anomalies-and-disorders" target="_blank" rel="noopener" style="color:var(--yellow)">Anomalias/Disfunção</a> · <a href="https://www.icy-veins.com/zenless-zone-zero/lumiflux-attribute-anomaly-effect-and-characters" target="_blank" rel="noopener" style="color:var(--yellow)">Lumiflux</a>.</p>`});

function escAttr(s){return e(s).replace(/`/g,'&#96;')}
function pic(src,fallback='',cls='',alt='',sources=[]){
  const catalog=[...DB.agents,...DB.engines,...DB.discs];
  const item=catalog.find(x=>x.name===alt)||(src?catalog.find(x=>x.img===src):null);
  let urls=[src,...(Array.isArray(sources)?sources:[]),fallback,...(item?[item.fallback,...(item.artSources||[])]:[])].filter(Boolean);
  urls=[...new Set(urls)]; const first=urls.shift()||'';
  const attr=escAttr(JSON.stringify(urls));
  return `<img class="${cls}" src="${escAttr(first)}" data-fallbacks='${attr}' loading="lazy" decoding="async" alt="${escAttr(alt)}" onerror="imgFail(this)">`;

function imgFail(img){

}

icamente.</p><div class="slotGrid">${b.slots.map(discSlotHTML).join('')}</div><h3>04 / ANOTAÇÕES DA BUILD</h3><textarea data-build="notes" rows="3" placeholder="Ex.: faltam materiais, meta de equipamentos...">${e(b.notes||'')}</textarea><div class="heroActions" style="margin-top:16px"><button class="btn yellow" data-analyze>ANALISAR MINHA BUILD ↗</button><button class="btn" data-save>GRAVAR ALTERAÇÕES</button><button class="btn red" data-remove-own="${e(a.name)}">REMOVER AGENTE</button></div><div id="assessment">${assessmentHTML(a,b)}</div></div>`}
function number(v){if(v===null||v===undefined||String(v).trim()==='')return NaN;return Number(String(v).trim().replace(/\s/g,'').replace(/,/g,'.'))}
function assess(a,b){let out=[],deep=DB.deep[a.name];const add=(kind,title,explain)=>out.push({kind,title,explain});
if(Number(b.level)>=60)add('pass','Nível 60 cadastrado','Nível máximo comum de agente alcançado.');else add('unknown','Nível do agente ainda em desenvolvimento',`Cadastrado nível ${b.level||1}. A prioridade é elevar o nível conforme o seu Inter-Knot.`);
let eng=engineByName(b.engine);if(eng){if(eng.role!==a.role)add('fail','Especialidade do motor incompatível',`Seu motor é de ${eng.role}; o agente é ${a.role}. A passiva não deve ser considerada ativa.`);else if(eng.name===a.engine)add('pass','Motor assinatura compatível',`${eng.name} é a assinatura cadastrada para o agente. Seus gatilhos em combate ainda precisam ser cumpridos.`);else add('pass','Especialidade do motor compatível',`Tipo ${a.role} compatível. Confira os gatilhos individuais da passiva.`)}else add('unknown','Motor não cadastrado','Escolha o W-Engine equipado para validar sua especialidade.');
const sets={};for(const sl of b.slots){if(sl.set)sets[sl.set]=(sets[sl.set]||0)+1}let four=Object.keys(sets).filter(x=>sets[x]>=4),twos=Object.keys(sets).filter(x=>sets[x]>=2);
if(b.slots.every(s=>s.set)){if(four.length&&twos.length>=2)add('pass','Bônus 4 + 2 completados',`Você possui ${Object.entries(sets).map(([n,c])=>`${c}× ${n}`).join(' + ')}.`);else if(twos.length>=3)add('pass','Três bônus de 2 peças ativos','Seu 2+2+2 funciona, mas verifique se sua build tem melhor alternativa 4+2.');else add('fail','Conjuntos de discos não fecham a configuração','Não identificamos 4+2 nem 2+2+2. Revise as seis peças.')}else add('unknown','Discos incompletos','Preencha os conjuntos das seis posições para verificar os bônus.');
let ideal4=deep?.ideal4||a.disc; if(ideal4&&sets[ideal4]>=4)add('pass','Conjunto principal recomendado',`4× ${ideal4} identificado.`);else if(ideal4&&b.slots.some(s=>s.set))add('unknown','Conjunto diferente do recomendado',`Esta referência usa 4× ${ideal4}. Seu set pode ser alternativa válida conforme o time, mas deve ser conferido.`);
const mains=deep?.mains||[];
for(const [slot,i] of [[4,0],[5,1],[6,2]]){const s=b.slots[slot-1];if(!s.main){add('unknown',`Disco ${slot} sem principal`,`Referência: ${mains[i]||['4 · '+(ROLE_DEFAULTS[a.role]?.s4||''),'5 · '+(ROLE_DEFAULTS[a.role]?.s5||''),'6 · '+(ROLE_DEFAULTS[a.role]?.s6||'')][i]}.`);continue}let suggested=norm(mains[i]||[ROLE_DEFAULTS[a.role]?.s4,ROLE_DEFAULTS[a.role]?.s5,ROLE_DEFAULTS[a.role]?.s6][i]||'');let chosen=norm(s.main);let synonyms=[['proficiência','proficiência'],['maestria','maestria'],['energia','energia'],['pEN','pen'],['crit','crit'],['impacto','impacto'],['def','def'],['fogo','fogo'],['atk','atk'],['atq','atq']];let match=suggested.includes(chosen)||synonyms.some(([x,y])=>chosen.includes(norm(x))&&suggested.includes(norm(y)));add(match?'pass':'unknown',`Disco ${slot} · ${s.main}`,match?'O principal parece alinhado à referência.':'Não coincide diretamente com a recomendação principal. Pode ser alternativa, verifique a ficha.');}
if(deep?.breaks)for(const t of deep.breaks){const v=number(b.stats?.[t.key]);let addon=t.key==='proficiency'?' (valor de combate pode ser maior que o exibido fora de combate)':'';if(!Number.isFinite(v))add('unknown',`Meta não medida: ${t.label}`,`${t.target}${t.key==='pen'?'%':''} · ${t.rule}`);else if(v>=t.target)add('pass',`${t.label}: ${v} / ${t.target}`,`Meta numérica atingida no valor informado${addon}. ${t.rule}`);else add('fail',`${t.label}: ${v} / ${t.target}`,`Abaixo da referência no valor informado${addon}. ${t.rule}`)}
let rule=DB.rules[a.name];if(rule){let team=account.teams.find(x=>x.includes(a.name)),all=team?team.map(agentByName).filter(Boolean):[],others=all.filter(x=>x.name!==a.name);if(!team)add('unknown','Habilidade adicional — formação não definida',`Regra: ${rule.label}. Inclua ${a.name} em uma de suas equipes.`);else{let pass=others.some(x=>rule.kind==='anomalyOrFaction'?(x.role==='Anomalia'||DB.factions[x.name]===rule.faction):rule.kind==='anomalyOrElement'?(x.role==='Anomalia'||x.element===a.element):(x.element===a.element||DB.factions[x.name]===rule.faction));add(pass?'pass':'fail',`Habilidade adicional ${pass?'ativável':'não ativada na formação'}`,`Equipe: ${team.join(' + ')}. Condição: ${rule.label}. Verifique exceções e status de habilidades no próprio jogo.`)}}else add('unknown','Habilidade adicional não automatizada','Não há condição verificada cadastrada para este personagem nesta edição. Não confunda com a Passiva Central, que pode estar funcionando normalmente.');
return out}
function assessmentHTML(a,b){let r=assess(a,b);let good=r.filter(x=>x.kind==='pass').length,fail=r.filter(x=>x.kind==='fail').length,uk=r.filter(x=>x.kind==='unknown').length;return `<div class="analysis"><div class="eyebrow">ANDERUS ANALYTICS / RESULTADO ORIENTATIVO</div><h3 style="margin:8px 0">${good} OK · ${fail} AJUSTES · ${uk} A VERIFICAR</h3><div class="progress"><span style="width:${Math.round(good/r.length*100)}%"></span></div><p class="small muted">Não é uma pontuação de dano. Cada verificação representa uma condição diferente; números não devem ser somados como um DPS Score. Alvos podem variar por modo, motor e buffs.</p>${r.map(x=>`<div class="result"><strong class="${x.kind}">${x.kind==='pass'?'✓':x.kind==='fail'?'✕':'?'} ${e(x.title)}</strong><p>${e(x.explain)}</p></div>`).join('')}</div>`}

if(d.build){let b=account.saved[account.selected];if(!b)return;let v=t.value;if(d.build.startsWith('stats.'))b.stats[d.build.split('.')[1]]=v;else b[d.build]=v;save();return}
if(d.slot){let b=account.saved[account.selected];if(!b)return;let i=Number(d.slot);b.slots[i][d.key]=t.value;save();if(d.key==='set'){let img=t.closest('.slot').querySelector('img.diskImg'),ds=discByName(t.value);if(img&&ds)img.src=ds.img}return}
if(d.team!==undefined){let i=Number(d.team),j=Number(d.pos);account.teams[i][j]=t.value;save();let el=$('#ruleteam_'+i);if(el)el.innerHTML=teamRuleHTML(account.teams[i]);let mini=t.closest('.teamEdit').querySelector('.teamMini');if(mini)mini.innerHTML=account.teams[i].map(n=>{let x=agentByName(n);return x?pic(x.img,x.fallback,'',n,x.artSources):'<span>+</span>'}).join('');return}
if(t.id==='importAccount'){importAccount(t.files?.[0]);t.value='';return}
}
document.addEventListener('input',ev=>{if(ev.target.matches('[data-filter],[data-build],[data-slot]'))handleChange(ev.target)});
document.addEventListener('change',ev=>{if(ev.target.matches('select[data-filter],select[data-build],select[data-slot],select[data-team],input#importAccount'))handleChange(ev.target)});
document.addEventListener('click',ev=>{let x=ev.target.closest('button,[data-nav],[data-open],[data-back],[data-lesson],[data-next-lesson],[data-clear],[data-own],[data-save],[data-analyze],[data-add-own],[data-select-own],[data-remove-own],[data-export-account] ,[data-refresh-data],[data-newstab]');if(!x)return;
if(x.dataset.nav){go(x.dataset.nav);return}
if(x.dataset.back!==undefined){back();return}
if(x.dataset.open){go('detail',x.dataset.open,x.dataset.id);return}
if(x.dataset.clear){filters[x.dataset.clear]={...Object.fromEntries(Object.keys(filters[x.dataset.clear]).map(k=>[k,k==='owned'?false:'']))};render();return}
if(x.dataset.lesson){lesson=x.dataset.lesson;render();let v=$('#lessonBody');if(v)requestAnimationFrame(()=>v.scrollIntoView({behavior:'smooth',block:'start'}));return}
if(x.dataset.nextLesson!==undefined){let ix=lessons.findIndex(i=>i.id===lesson);lesson=lessons[(ix+1)%lessons.length].id;render();requestAnimationFrame(()=>$('#lessonBody')?.scrollIntoView({behavior:'smooth',block:'start'}));return}
if(x.dataset.own){openOwner(x.dataset.own);return}
if(x.dataset.selectOwn){account.selected=x.dataset.selectOwn;save();let ed=$('#accountEditor');if(ed)ed.innerHTML=savedEditor();let li=$('#accountListItems');if(li)li.innerHTML=accountAgentList();return}
if(x.dataset.addOwn!==undefined){let n=$('#newOwner')?.value;if(!n){toast('Escolha um agente para cadastrar.');return}openOwner(n);return}
if(x.dataset.removeOwn){let n=x.dataset.removeOwn;if(confirm('Remover '+n+' da sua Conta do Anderus?')){delete account.saved[n];account.selected=Object.keys(account.saved)[0]||'';save();render();toast('Agente removido do inventário.')}return}
if(x.dataset.save!==undefined){save();toast('Build registrada neste navegador.');return}
if(x.dataset.analyze!==undefined){let b=account.saved[account.selected],a=agentByName(account.selected);if(b&&a){$('#assessment').innerHTML=assessmentHTML(a,b);$('#assessment').scrollIntoView({behavior:'smooth',block:'center'})}return}
if(x.dataset.exportAccount!==undefined){exportAccount();return}
if(x.dataset.newstab){currentNewsTab=x.dataset.newstab;let tabs=$$('.newsTabs button');tabs.forEach(t=>t.classList.toggle('selected',t.dataset.newstab===currentNewsTab));let list=$('#newsList');if(list)list.innerHTML=timelineCards(currentNewsTab);return}
if(x.dataset.refreshData!==undefined){refreshRemote();return}
});
// Restores the previous page and its exact scroll position with the system/Browser Back button.
async function updateHostedData(){if(location.protocol==='file:'||location.protocol==='about:')return;try{const [r1,r2]=await Promise.all([fetch('data/updates.json?ts='+Date.now(),{cache:'no-store'}),fetch('data/patch.json?ts='+Date.now(),{cache:'no-store'})]);if(r1.ok){let feed=await r1.json();if(Array.isArray(feed.entries))remoteFeed=feed;}if(r2.ok){const patch=await r2.json();if(patch.schema===1){for(const kind of ['agents','engines','discs']){if(!Array.isArray(patch[kind]))continue;for(const item of patch[kind]){if(!item.id||!item.name)continue;const loc=DB[kind].findIndex(x=>x.id===item.id);if(loc>=0)DB[kind][loc]={...DB[kind][loc],...item};else DB[kind].push(item)}}if(patch.revision)DB.revision=patch.revision;render()}}}catch(ex){/* Offline remains fully usable */}}
function init(){const h=location.hash.slice(1).split('/');let page=h[0]||'home';if(page==='detail'&&h.length>=3){S.page='detail';S.type=h[1];S.id=decodeURIComponent(h[2]);}else{S.page=titleNames[page]?page:'home'}history.replaceState({...S,y:0},'',location.href);save(true);render();updateHostedData();}
init();
